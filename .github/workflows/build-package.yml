name: Build deb packages

on:
  push:
    branches: [ packaging ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: deb13
            codename: trixie
            image: debian:13-slim
          - name: deb12
            codename: bookworm
            image: debian:12-slim
          - name: "25.10"
            codename: questing
            image: ubuntu:25.10
          - name: "25.04"
            codename: plucky
            image: ubuntu:25.04
          - name: "24.04"
            codename: noble
            image: ubuntu:24.04
          - name: "22.04"
            codename: jammy
            image: ubuntu:22.04
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          tags: qlue-ui-builder:${{ matrix.name }}
          build-args: |
            BASE_IMAGE=${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          context: debian
          file: debian/Dockerfile


      - uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          before-build-hook: |
              sed -i "1s/(\(.*\))/(\1~${{ matrix.codename }}~${{ matrix.name }})/" debian/changelog
          buildpackage-opts: --build=binary --no-sign
          docker-image: qlue-ui-builder:${{ matrix.name }}

      #- name: upload
      #  uses: actions/upload-artifact@v7
      #  with:
      #    path: debian/artifacts/
      #    name: ${{ matrix.name}}-${{ matrix.codename }}
